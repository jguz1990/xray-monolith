name: GCS Stable Recovery

on:
  push:
    branches: [gcs-performance]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gcs-stable-recovery
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Configure pagefile
        uses: al-cheb/configure-pagefile-action@v1.3
        with:
          minimum-size: 8GB
          maximum-size: 8GB
          disk-root: "C:"

      - name: Checkout exact pre-MT stable performance source
        uses: actions/checkout@v4
        with:
          ref: afbf2b33bb238017ea87322c5c659795ea187d39
          fetch-depth: 0
          submodules: recursive

      - name: Verify recovery baseline
        shell: pwsh
        run: |
          $expected = 'afbf2b33bb238017ea87322c5c659795ea187d39'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "Wrong recovery baseline: $actual" }
          Write-Host "Recovery baseline verified: $actual"

      - name: Apply stable GCS performance passes 1 through 7
        shell: pwsh
        run: |
          1..7 | ForEach-Object {
            $script = "gcs-engine/apply_pass$_.py"
            if (-not (Test-Path $script)) { throw "Missing $script" }
            python $script .
            if ($LASTEXITCODE -ne 0) { throw "$script failed" }
          }

      - name: Validate isolated stable source
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }

          $dev = Get-Content src/xrEngine/device.h -Raw
          $thr = Get-Content src/xrEngine/EngineThreading.cpp -Raw
          $wnd = Get-Content src/xrGame/ui/UIWindow.cpp -Raw
          $hud = Get-Content src/xrGame/HUDManager.cpp -Raw
          $zoneH = Get-Content src/xrGame/UIZoneMap.h -Raw
          $zoneCpp = Get-Content src/xrGame/UIZoneMap.cpp -Raw
          $trade = Get-Content src/xrGame/ui/UIActorMenuTrade.cpp -Raw
          $cells = Get-Content src/xrGame/ui/UICellCustomItems.cpp -Raw

          # Stable performance work must be present.
          if ($trade -notmatch 'CanMoveToPartnerWithWeights') { throw 'Pass 4 missing' }
          if ($trade -notmatch 'filter_kinds') { throw 'Pass 5 missing' }
          if ($cells -notmatch 'layout_changed') { throw 'Pass 6 missing' }
          if ($trade -notmatch 'item_id_in_sorted_list') { throw 'Pass 7 missing' }
          if ($zoneH -notmatch 'CUIWindow& MapFrame\(\);') { throw 'minimap declaration missing' }
          if ($zoneCpp -notmatch 'return \*m_activeMap;') { throw 'live minimap accessor missing' }

          # Everything added after the stable point must be absent.
          if ($dev -match 'GCS MT Pass 8') { throw 'Pass 8 unexpectedly present' }
          if ($thr -match 'lua_gc_count') { throw 'Pass 8 worker rewrite unexpectedly present' }
          if ($thr -match 'for \(const ISpatialShared& spatial : spatials\)') { throw 'Pass 9 unexpectedly present' }
          if ($wnd -match 'GCS Pass 10') { throw 'Pass 10 unexpectedly present' }
          if ($hud -match 'GCS Pass 11') { throw 'Pass 11 unexpectedly present' }
          if (Test-Path gcs-engine/apply_pass12.py) { throw 'Post-stable Pass 12 exists in checkout; wrong baseline' }

          Write-Host 'Isolated stable recovery validated: exact afbf2b33 baseline + Passes 1-7 only.'

      - uses: microsoft/setup-msbuild@v1.3.1
        with:
          msbuild-architecture: x64

      - name: Build DX11
        shell: pwsh
        run: msbuild /m /p:Configuration=DX11 src/engine-vs2022.sln

      - name: Package stable recovery build
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'gcs_stable_recovery'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $bin = Join-Path $env:GITHUB_WORKSPACE '_build\_game\bin_dbg'
          $exe = Join-Path $bin 'AnomalyDX11.exe'
          $pdb = Join-Path $bin 'AnomalyDX11.pdb'
          if (-not (Test-Path $exe)) { throw 'AnomalyDX11.exe not found' }
          if (-not (Test-Path $pdb)) { throw 'AnomalyDX11.pdb not found' }
          Copy-Item $exe (Join-Path $out 'AnomalyDX11GCS_Perf.exe') -Force
          Copy-Item $pdb (Join-Path $out 'AnomalyDX11.pdb') -Force
          @(
            'GCS DX11 stable recovery build'
            'Exact source baseline: afbf2b33bb238017ea87322c5c659795ea187d39'
            'Performance passes enabled: 1-7 only'
            'Passes 8-14: NOT INCLUDED'
            'Smooth-scrolling wheel backport: NOT INCLUDED in this crash-isolation build'
            'Live minimap MapFrame behavior retained through stable Pass 3'
            "Workflow trigger commit: $env:GITHUB_SHA"
          ) | Set-Content (Join-Path $out 'BUILD_INFO.txt')
          Get-ChildItem $out -File | ForEach-Object {
            $h = Get-FileHash $_.FullName -Algorithm SHA256
            "$($h.Hash.ToLower())  $($_.Name)"
          } | Set-Content (Join-Path $out 'SHA256SUMS.txt')

      - uses: actions/upload-artifact@v4.6.0
        with:
          name: GCS-DX11-Stable-Recovery
          path: gcs_stable_recovery/
          if-no-files-found: error
          retention-days: 7
