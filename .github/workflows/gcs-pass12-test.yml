name: GCS Stable Recovery

on:
  push:
    branches: [gcs-performance]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gcs-stable-recovery
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Configure pagefile
        uses: al-cheb/configure-pagefile-action@v1.3
        with:
          minimum-size: 8GB
          maximum-size: 8GB
          disk-root: "C:"

      - uses: actions/checkout@v4
        with:
          ref: gcs-performance
          fetch-depth: 0
          submodules: recursive

      - name: Apply stable GCS performance passes 1 through 7
        shell: pwsh
        run: |
          1..7 | ForEach-Object {
            $script = "gcs-engine/apply_pass$_.py"
            if (-not (Test-Path $script)) { throw "Missing $script" }
            python $script .
            if ($LASTEXITCODE -ne 0) { throw "$script failed" }
          }

      - name: Apply independent wheel-event backport
        shell: pwsh
        run: |
          python gcs-engine/apply_pass12.py .
          if ($LASTEXITCODE -ne 0) { throw 'Pass 12 wheel backport failed' }

      - name: Validate stable recovery source
        shell: pwsh
        run: |
          $dev = Get-Content src/xrEngine/device.h -Raw
          $thr = Get-Content src/xrEngine/EngineThreading.cpp -Raw
          $ui = Get-Content src/xrGame/UIGameCustom.cpp -Raw
          $wnd = Get-Content src/xrGame/ui/UIWindow.cpp -Raw
          $main = Get-Content src/xrGame/ui/UIMainIngameWnd.cpp -Raw
          $a = Get-Content src/xrGame/ui/UIScriptWnd.cpp -Raw
          $b = Get-Content src/xrGame/ui/UIWindow_script.cpp -Raw
          $c = Get-Content src/xrGame/ui/uiscriptwnd_script.h -Raw
          $d = Get-Content src/xrGame/ui/uiscriptwnd_script2.cpp -Raw
          $z = Get-Content src/xrGame/UIZoneMap.cpp -Raw

          # Recovery rule: do not apply experimental MT/UI lifetime passes 8-11 or 13-14.
          if ($dev -match 'GCS MT Pass 8') { throw 'Pass 8 unexpectedly present' }
          if ($thr -match 'lua_gc_count') { throw 'Pass 8 worker rewrite unexpectedly present' }
          if ($thr -match 'for \(const ISpatialShared& spatial : spatials\)') { throw 'Pass 9 unexpectedly present' }
          if ($wnd -match 'GCS Pass 10') { throw 'Pass 10 unexpectedly present' }
          if ($ui -match 'GCS Pass 13') { throw 'Pass 13 unexpectedly present' }
          if ($main -match 'GCS Pass 14') { throw 'Pass 14 unexpectedly present' }

          # Stable functionality retained.
          if ($z -notmatch 'return \*m_activeMap;') { throw 'source-native minimap hook missing' }
          if ($a -notmatch 'OnMouseAction') { throw 'wheel OnMouseAction missing' }
          if ($b -notmatch 'WINDOW_MOUSE_WHEEL_UP') { throw 'wheel up missing' }
          if ($b -notmatch 'WINDOW_MOUSE_WHEEL_DOWN') { throw 'wheel down missing' }
          if ($c -notmatch 'OnMouse') { throw 'Lua OnMouse wrapper missing' }
          if ($d -notmatch '\.def\("OnMouse"') { throw 'Lua OnMouse registration missing' }

          Write-Host 'Stable recovery validated: Passes 1-7 + wheel backport; experimental Passes 8-11/13-14 absent.'

      - uses: microsoft/setup-msbuild@v1.3.1
        with:
          msbuild-architecture: x64

      - name: Build DX11
        shell: pwsh
        run: msbuild /m /p:Configuration=DX11 src/engine-vs2022.sln

      - name: Package stable recovery build
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'gcs_stable_recovery'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $bin = Join-Path $env:GITHUB_WORKSPACE '_build\_game\bin_dbg'
          $exe = Join-Path $bin 'AnomalyDX11.exe'
          $pdb = Join-Path $bin 'AnomalyDX11.pdb'
          if (-not (Test-Path $exe)) { throw 'AnomalyDX11.exe not found' }
          if (-not (Test-Path $pdb)) { throw 'AnomalyDX11.pdb not found' }
          Copy-Item $exe (Join-Path $out 'AnomalyDX11GCS_Perf.exe') -Force
          Copy-Item $pdb (Join-Path $out 'AnomalyDX11.pdb') -Force
          @(
            'GCS DX11 stable recovery build'
            'Performance passes enabled: 1-7'
            'Experimental MT passes 8-9 removed from this build.'
            'Experimental crash-containment passes 10-11 and 13-14 removed from this build.'
            'Pass 12 retained only as the isolated upstream Lua mouse-wheel event backport.'
            'Source-native minimap MapFrame hook retained.'
            "Commit: $env:GITHUB_SHA"
          ) | Set-Content (Join-Path $out 'BUILD_INFO.txt')
          Get-ChildItem $out -File | ForEach-Object {
            $h = Get-FileHash $_.FullName -Algorithm SHA256
            "$($h.Hash.ToLower())  $($_.Name)"
          } | Set-Content (Join-Path $out 'SHA256SUMS.txt')

      - uses: actions/upload-artifact@v4.6.0
        with:
          name: GCS-DX11-Stable-Recovery
          path: gcs_stable_recovery/
          if-no-files-found: error
          retention-days: 7
